# An index of this development is only worth as much as it is current, and a
# formalization moves whether or not anyone remembers to re-export it.  So the
# export runs here, where the library is already being built.
#
# What comes out is a static directory — the definitional dependency graph, the
# rendered source, and the marks — which the trust web UI reads directly.  It is
# published to a `trust-index` release, one asset per file, so that anyone can
# read this development at
#
#     https://<a trust deployment>/?release=lana-agents/formal-schemes
#
# and it is kept as an artifact besides, for `gh run download`.
#
# A release rather than the `trust-index` branch this used to force-push.  The
# index of this development is 302 MB across 123 files, all of it generated, and
# a branch keeps every byte of it in the repository people clone for the
# mathematics; `decls.jsonl` was also within sight of git's 100 MB blob limit,
# which is a wall rather than a cost.  A release holds the same files outside the
# history, with a 2 GB ceiling per file.
#
# What it gives up is that a release asset carries no
# `Access-Control-Allow-Origin`, so a browser cannot fetch one cross-origin: a
# deployment reads these only by proxying them onto its own origin, which
# chrisflav/trust-web does at `/release/`.  A branch needed no such thing.  What
# neither can be is the workflow artifact below — downloading one requires a
# token with the `repo` scope even though this repository is public, so a
# frontend reading artifacts would have to ask every reader for full control of
# their private repositories to show them a public dependency graph.
#
# See the `publish` input of chrisflav/trust-action for the whole of that trade.
name: Trust index

on:
  push:
    branches: [master]
  # Only when this file changes.  An export is minutes of work that says nothing
  # about a pull request's mathematics, so it has no business running on every
  # one — but a change to the workflow itself has to be testable before it is
  # merged, and `workflow_dispatch` cannot do that from a branch.
  pull_request:
    paths: ['.github/workflows/trust-index.yml']
  workflow_dispatch:

# Only the newest commit on a branch is worth indexing; the older run is
# answering a question nobody is still asking.
concurrency:
  group: trust-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest

    # Only to push the index branch; nothing else here writes anything.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # `v1.3.0` rather than the `v1` line, because `publish: release` is new in
      # it and `v1` still points at `v1.2.0`, which refuses the value.  This can
      # go back to `@v1` once that tag moves; it is pinned here so that master is
      # not waiting on a tag to be pushed somewhere else.
      - id: trust
        uses: chrisflav/trust-action@v1.3.0
        with:
          module: FormalSchemes
          # No `module-filter`, so the index covers the whole import closure —
          # Mathlib included.  A far larger export than our own declarations
          # alone, and the reason to pay for it is that this development is
          # mostly *about* what it rests on: filtered, a Mathlib name is an edge
          # that stops, and following the definitions out of `Spf` into the
          # scheme theory underneath is the question the graph exists to answer.
          # Nothing names a version of trust: the exporter can only read the
          # `.olean` files of the Lean it was built on, so the action reads
          # `lean-toolchain` and fetches the release built for it.  When the
          # Mathlib update action moves us to a Lean no trust has been released
          # for yet, this fails saying exactly that.
          #
          # Publish from master only.  This workflow also runs on a pull request
          # that edits it, and an index of a branch published over master's would
          # leave the release describing a commit that was never merged — quite
          # apart from a fork's token having no write access to upload it with.
          # `github.ref` is `refs/pull/N/merge` there and `refs/heads/master`
          # for both a push and a manual run.
          publish: ${{ github.ref == 'refs/heads/master' && 'release' || 'false' }}

      - uses: actions/upload-artifact@v4
        with:
          name: trust-index
          # The root rather than the index directory, so the artifact unpacks
          # into the `<root>/<name>/meta.json` shape the frontend reads.
          path: ${{ steps.trust.outputs.index-root }}
          retention-days: 30
