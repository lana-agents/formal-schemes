    topologically finite type morphisms, closed immersions, separatedness and fibre products over an
    affine adic base, free quotients, and a formal model of the Tate curve of period q². Open: the
    glued analogue of completionStructureSheafIso and the identification of the scheme glued from
    PrincipalAffineCover.completionDatum with the given scheme, separatedness after restriction to
    an open meeting several charts, and a Tate model of period q. Out of scope: Raynaud generic
    fibres and the rigid-analytic side.
