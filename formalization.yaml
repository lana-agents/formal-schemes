version: "v0.4"

project:
  name: "formal-schemes"
  description: >-
    A Lean 4 / Mathlib formalization of formal schemes following EGA I (Ch. 0 §7, §10, Ch. I §10)
    and the Stacks project. For an adic ring R with ideal of definition I it constructs the formal
    spectrum Spf R with structure sheaf the inverse limit of the structure sheaves of the
    thickenings Spec (R ⧸ I^(n+1)), computes global sections (≃ R) and sections on basic opens (the
    I-adic completion of R_f), shows that stalks are local, that Spf is functorial as a locally
    ringed space and independent of the ideal of definition, and defines formal schemes. Beyond the
    affine case: gluing, the colimit property of morphisms out of Spf R, formal completion along a
    closed subset, topologically finite type morphisms, closed immersions and separatedness over an
    affine adic base, fibre products over an affine adic base, quotients by free properly
    discontinuous actions, and a formal model of the Tate curve (a Néron 2-gon of period q²).
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Éléments de géométrie algébrique I"
    authors: ["Alexander Grothendieck", "Jean Dieudonné"]
    type: "book"
    location: "Ch. 0 §7, §10 and Ch. I §10 (10.1-10.15)"
    relationship: "formalizes"
    note: "The affine theory and the notion of formal scheme; see fidelity.divergences for what is open."
    author_endorsement: "n/a"
  - title: "The Stacks Project, Chapter Formal Schemes"
    authors: ["The Stacks project authors"]
    id: "https://stacks.math.columbia.edu/tag/0AHY"
    type: "web"
    location: "Tags 07E7, 0AHZ, 0AI5, 0AI7, 0AIL ff."
    relationship: "adapts"
    author_endorsement: "n/a"
  - title: "Lectures on Formal and Rigid Geometry"
    authors: ["Siegfried Bosch"]
    id: "doi:10.1007/978-3-319-04417-0"
    type: "book"
    location: "Lecture Notes in Mathematics 2105, Part B, §9 (the Tate curve)"
    relationship: "adapts"
    author_endorsement: "n/a"

