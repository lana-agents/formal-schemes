  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    Following Mathlib's conventions the structure sheaf of Spf R is a sheaf of plain commutative
    rings; the adic topology of EGA is recovered through the explicit limit description of its
    sections. Formal completion is constructed for an affine ambient scheme and for schemes
    presented by affine charts; the glued comparison with the thickenings and the identification
    of the glued scheme with X are open. Separatedness and fibre products are over an affine adic
    base. The Tate curve model has period q² (a Néron 2-gon), not q.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    All results are machine-checked by the Lean kernel. The axioms listed under status were not
    re-checked with `#print axioms` for this file: no built, idle clone of this revision was
    available (a local build of this revision was killed for memory). The evidence is `git grep`:
    no sorry, axiom declaration, admit or native_decide occurs in any .lean file, so every
    declaration depends at most on Lean's three standard axioms.

alignment:
  namespace: "FormalSpectrum"
  statements:
    - source: "EGA I, 10.1.3 (global sections of Spf R)"
      lean: "FormalSpectrum.globalSectionsEquiv"
      module: "FormalSchemes/Sections.lean"
      status: "proved"
    - source: "EGA I, 10.1.4 / Stacks Tag 0AI7 (sections on D(f))"
      lean: "FormalSpectrum.sectionsBasicOpenEquiv"
      module: "FormalSchemes/Sections.lean"
      status: "proved"
    - source: "EGA I, 10.1.6 (Spf R is a locally ringed space)"
      lean: "FormalSpectrum.isLocalRing_structureSheaf_stalk"
      module: "FormalSchemes/Spf.lean"
      status: "proved"
    - source: "EGA I, 10.2.2 (functoriality of Spf)"
      lean: "FormalSpectrum.locallyRingedSpaceMap"
      module: "FormalSchemes/SpfMap.lean"
      status: "proved"
    - source: "EGA I, 10.6.10 (morphisms out of Spf R)"
      lean: "FormalSpectrum.existsUnique_hom_thickeningMap_formalScheme"
      module: "FormalSchemes/SpfHomFormalScheme.lean"
      status: "proved"

